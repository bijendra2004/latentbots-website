<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Green Quarter-Arc/Sector -->
  <path d="M185 285C185 160 235 45 308 14V235H185Z" fill="#D8E7BA" fill-opacity="0.9"/>

  <!-- Top-Left Chat Bubble -->
  <g id="top-bubble">
    <rect x="88" y="72" width="138" height="52" rx="14" fill="#FFFFFF" stroke="#19312B" stroke-width="2.4"/>
    <path d="M190 124L205 137L205 124" fill="#FFFFFF"/>
    <path d="M190 124L205 137L205 124" stroke="#19312B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Overwrite border overlap inside tail -->
    <line x1="192" y1="124" x2="204" y2="124" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Bubble Content -->
    <circle cx="114" cy="98" r="11" fill="#ADC984"/>
    <line x1="137" y1="93" x2="203" y2="93" stroke="#19312B" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="137" y1="105" x2="182" y2="105" stroke="#19312B" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Bottom-Left Chat Bubble -->
  <g id="bottom-bubble">
    <rect x="48" y="160" width="130" height="50" rx="14" fill="#FFFFFF" stroke="#19312B" stroke-width="2.4"/>
    <path d="M78 210L68 223L88 210" fill="#FFFFFF"/>
    <path d="M78 210L68 223L88 210" stroke="#19312B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Overwrite border overlap inside tail -->
    <line x1="77" y1="210" x2="87" y2="210" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Bubble Content -->
    <circle cx="73" cy="185" r="11" fill="#ADC984"/>
